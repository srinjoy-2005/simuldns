<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DNS Lab</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>DNS Lab</h1>
    <span id="status" role="status">Connecting…</span>
    <div class="actions">
      <button id="run" class="primary" disabled>Run</button>
      <button id="stop" disabled>Stop</button>
      <button id="remake" disabled>Remake</button>
      <button id="quit" disabled>Quit</button>
    </div>
  </header>
  <main>
    <p id="error" role="alert" hidden></p>
    <section class="workspace">
      <div class="topology">
        <div class="section-bar">
          <h2>Topology</h2>
          <div class="actions"><button id="add-resolver">Add resolver</button><button id="add-external">Add upstream</button></div>
        </div>
        <div class="canvas">
          <svg id="graph" viewBox="0 0 900 390" aria-label="DNS topology. Drag nodes to arrange them, or drag from an output port to connect an upstream.">
            <defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z"/></marker></defs>
            <g id="edges"></g><g id="nodes"></g>
          </svg>
        </div>
      </div>
      <aside id="properties" aria-label="Selected node properties"></aside>
    </section>
    <section class="traces">
      <div class="section-bar"><h2>Query traces</h2><span id="trace-count"></span></div>
      <div class="trace-layout">
        <div id="trace-list"></div>
        <div id="waterfall"></div>
      </div>
    </section>
  </main>
</body>
</html>
